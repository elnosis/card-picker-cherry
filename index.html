<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 피커 체리</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --warning-color: #dc2626;
            --disabled-bg: #f1f5f9;
            --disabled-text: #94a3b8;
            --progress-bg: #dbeafe;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --card-bg: #1e293b;
                --text-color: #f1f5f9;
                --text-muted: #94a3b8;
                --primary-color: #3b82f6;
                --primary-dark: #2563eb;
                --border-color: #334155;
                --success-color: #22c55e;
                --warning-color: #f87171;
                --disabled-bg: #1e293b;
                --disabled-text: #64748b;
                --progress-bg: #1e3a5f;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px 16px 20px;
        }

        /* 안드로이드 앱바 스타일 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--primary-color);
            color: #fff;
            padding: 14px 16px;
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            width: 100%;
            box-sizing: border-box;
        }

        header h1 {
            font-size: 1.2rem;
            margin: 0;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
        }

        .version-badge {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--primary-color);
            background-color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
            letter-spacing: 0.3px;
            line-height: 1.4;
            display: inline-block;
            vertical-align: middle;
        }

        /* 모달 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 14px;
            width: 100%;
            max-width: 480px;
            margin-top: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.18);
            overflow: hidden;
            color: var(--text-color);
        }

        /* 하단 알림 팝업 */
        #remaining-alert-modal {
            align-items: flex-end;
            padding: 0;
            justify-content: center;
        }

        #remaining-alert-modal .modal-content {
            max-width: 480px;
            width: 100%;
            margin: 0;
            border-radius: 16px 16px 0 0;
            box-shadow: 0 -4px 24px rgba(0,0,0,0.18);
        }

        #remaining-alert-modal .modal-header {
            border-bottom: none;
            background: var(--primary-color);
            color: #fff;
            padding: 14px 18px;
        }

        #remaining-alert-modal .modal-header h2 {
            color: #fff;
            font-size: 1.05rem;
        }

        #remaining-alert-modal .modal-close {
            color: rgba(255,255,255,0.9);
        }

        #remaining-alert-modal .modal-body {
            padding: 16px 18px 8px;
        }

        #remaining-alert-modal .modal-footer {
            justify-content: stretch;
            padding: 12px 16px 20px;
            border-top: none;
        }

        #remaining-alert-modal .modal-footer .modal-btn {
            width: 100%;
        }

        .alert-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 12px 0;
        }

        .alert-item + .alert-item {
            /* 항목 간격 (디바이더 없음) */
            margin-top: 4px;
        }

        .alert-item-main {
            flex: 1;
            min-width: 0;
        }

        .alert-item-card {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .alert-item-name {
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.35;
            word-break: break-word;
        }

        .alert-item-amount {
            flex-shrink: 0;
            text-align: right;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary-color);
            white-space: nowrap;
            padding-top: 2px;
        }

        .alert-empty {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: center;
            padding: 12px 0;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--primary-color);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .modal-body {
            padding: 16px 18px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .default-card-block {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .default-card-name {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
            color: #333;
        }

        .default-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            gap: 10px;
        }

        .default-row label {
            font-size: 0.85rem;
            color: #555;
            font-weight: 600;
            white-space: nowrap;
        }

        .default-row select {
            flex: 1;
            max-width: 180px;
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .option-group {
            margin-top: 6px;
            padding-top: 8px;
            border-top: 1px dashed #ddd;
        }

        .option-group-title {
            font-size: 0.8rem;
            color: #777;
            margin-bottom: 6px;
        }

        .option-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .option-chip {
            font-size: 0.78rem;
            padding: 4px 10px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.15s;
        }

        .option-chip.active {
            background: var(--primary-color);
            color: #fff;
            border-color: var(--primary-color);
        }

        .modal-footer {
            padding: 12px 18px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .modal-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn-primary {
            background: var(--primary-color);
            color: #fff;
        }

        .modal-btn-secondary {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        /* 플로팅 액션 버튼 */
        .fab {
            position: fixed;
            right: 20px;
            bottom: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            font-size: 1.8rem;
            font-weight: 300;
            line-height: 1;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, background-color 0.15s;
        }

        .fab:hover {
            background-color: var(--primary-dark);
            transform: scale(1.06);
        }

        .fab:active {
            transform: scale(0.96);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }

        .options-container {
            position: relative;
        }

        .options-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            color: #fff;
            transition: background-color 0.2s;
        }

        .options-btn:hover {
            background-color: rgba(255,255,255,0.15);
        }

        .search-result-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }

        .search-result-item .sr-card {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .search-result-item .sr-name {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .search-result-item .sr-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .search-result-item .sr-remain {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-color);
        }

        .options-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 120%;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            z-index: 250;
            min-width: 180px;
            overflow: hidden;
        }

        .options-dropdown.show {
            display: block;
        }

        .options-dropdown button {
            width: 100%;
            padding: 10px 14px;
            border: none;
            background: none;
            font-size: 0.85rem;
            text-align: left;
            cursor: pointer;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .options-dropdown button:hover {
            background-color: #f8f9fa;
            color: var(--primary-color);
        }

        .tab-menu {
            display: flex;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: none;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .filter-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .filter-box label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #555;
        }

        .spinner-select {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        .chart-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .chart-title {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-item {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-name {
            font-weight: bold;
            font-size: 1.05rem;
        }

        .order-btns {
            display: flex;
            gap: 4px;
        }

        .order-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 26px;
            height: 26px;
            font-size: 0.8rem;
            color: var(--text-color);
            cursor: pointer;
        }

        .performance-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
        }

        .performance-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .performance-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            white-space: nowrap;
        }

        .month-settings-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 12px;
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.35;
        }

        .month-settings-summary .mss-text {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .month-settings-summary .mss-text strong {
            color: var(--text-color);
            font-weight: 600;
        }

        .mss-btn {
            flex-shrink: 0;
            border: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 34px;
            height: 34px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .benefit-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .benefit-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            transition: opacity 0.2s, filter 0.2s;
        }

        .benefit-item.clickable {
            cursor: pointer;
        }

        .benefit-item.clickable:active {
            opacity: 0.85;
        }

        .benefit-item.disabled {
            background-color: var(--disabled-bg);
        }

        .benefit-item.disabled .benefit-name,
        .benefit-item.disabled .benefit-meta,
        .benefit-item.disabled .benefit-limit-row > span:not(.benefit-remaining) {
            color: var(--disabled-text);
            opacity: 0.75;
        }

        .benefit-item.disabled .progress-bar-fill {
            background-color: var(--disabled-text);
            opacity: 0.7;
        }

        .benefit-remaining.done {
            color: var(--primary-color);
            font-weight: 700;
            opacity: 1 !important;
            filter: none !important;
        }

        .benefit-item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 6px;
        }

        .type-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .benefit-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .benefit-meta {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 4px;
        }

        .benefit-limit-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }

        .benefit-remaining {
            color: var(--primary-color);
            font-weight: bold;
        }

        .progress-bar-bg {
            background-color: var(--progress-bg);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background-color: var(--primary-color);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .no-limit-text {
            font-size: 0.8rem;
            color: #888;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            color: #888;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .empty-state strong {
            color: var(--primary-color);
        }

        .record-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .form-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .record-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-control {
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 5px;
        }

        .record-history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .record-history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .record-history-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }

        .type {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .type-discount, .type-청구할인, .type-현장할인 { background-color: #ffebee; color: #d32f2f; }
        .type-카드사혜택, .type-company { background-color: #e3f2fd; color: #1565c0; }
        .type-point, .type-적립 { background-color: #e8f5e9; color: #2e7d32; }
        .type-cashback, .type-기타 { background-color: #e3f2fd; color: #1976d2; }

        .record-history-right {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .record-history-right .record-amount {
            font-weight: bold;
            white-space: nowrap;
        }

        .record-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .record-actions .edit-btn,
        .record-actions .delete-btn {
            display: block;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 4px 0;
            line-height: 1.4;
            text-align: right;
        }

        .record-actions .edit-btn {
            color: var(--primary-color);
        }

        .record-actions .delete-btn {
            color: #ff5252;
        }

        .history-benefit-name {
            font-size: 0.8rem;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
    </style>
</head>
<body>

<!-- 안드로이드 앱바 스타일 헤더 (전체 폭) -->
<header>
    <h1>🍒 카드 피커 체리 <span class="version-badge" id="app-version">v1.0.64</span></h1>
    
    <div class="header-actions">
        <button class="options-btn" onclick="openRemainingList(true)" aria-label="이 달의 남은 혜택" title="이 달의 남은 혜택">🔍</button>
        <div class="options-container">
            <button class="options-btn" onclick="toggleOptionsMenu(event)" aria-label="옵션 메뉴">⋮</button>
            <div class="options-dropdown" id="options-dropdown">
                <button onclick="triggerCardBenefitsImport()">📥 카드 혜택 가져오기</button>
                <button onclick="exportData()">📤 사용 기록 내보내기</button>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js')
            .then(reg => {
                console.log('Service Worker Registered!', reg);
                // 등록 후 약간의 딜레이를 두고 버전 요청
                setTimeout(fetchAppVersion, 300);
            })
            .catch(err => console.error('Service Worker Registration Failed!', err));

        // 컨트롤러가 이미 있으면 바로, 없으면 controllerchange 대기
        if (navigator.serviceWorker.controller) {
            fetchAppVersion();
        }
        navigator.serviceWorker.addEventListener('controllerchange', () => {
            fetchAppVersion();
        });
    }

    function fetchAppVersion() {
        const badge = document.getElementById('app-version');
        if (!badge) return;

        // 서비스 워커가 아직 제어하지 않으면 기본값 유지
        if (!navigator.serviceWorker.controller) {
            badge.textContent = 'v1.0.64';
            return;
        }

        const channel = new MessageChannel();
        channel.port1.onmessage = (event) => {
            if (event.data && event.data.version) {
                badge.textContent = event.data.version;
            }
        };
        navigator.serviceWorker.controller.postMessage(
            { type: 'GET_VERSION' },
            [channel.port2]
        );
    }

    // ===== 데이터 저장소 =====
    // cardBenefitsData: { "카드명": { "30만원": [ {name, type, rate, limit, option}, ... ], ... }, ... }
    let cardBenefitsData = JSON.parse(localStorage.getItem('card_picker_cherry_benefits')) || null;

    // benefitData: 사용 기록 [{ id, cardName, benefitName, type, date, amount }]
    let benefitData = JSON.parse(localStorage.getItem('card_picker_cherry_data')) || [];

    // performanceData: { "2026-08": { "카드명": "30만원", ... }, ... }  // 선택한 전월 실적 티어
    let performanceData = JSON.parse(localStorage.getItem('card_picker_cherry_perf')) || {};

    // cardDefaults: 기본값 { defaultTier, selectedOptionBenefits, selectedGrades, linkedCompanyProduct }
    let cardDefaults = JSON.parse(localStorage.getItem('card_picker_cherry_defaults')) || {};

    // 월별 옵션: { "2026-08": { "카드명": { "1": "혜택명", ... } } }
    let monthlyOptions = JSON.parse(localStorage.getItem('card_picker_cherry_monthly_options')) || {};
    // 월별 등급: { "2026-08": { "카드명": ["VIP", "청년"] } }
    let monthlyGrades = JSON.parse(localStorage.getItem('card_picker_cherry_monthly_grades')) || {};

    // cardIssuers: { "카드명": "삼성카드", ... }
    let cardIssuers = JSON.parse(localStorage.getItem('card_picker_cherry_issuers')) || {};

    let myChart = null;

    function formatCardLabel(cardName) {
        const issuer = cardIssuers[cardName];
        return issuer ? `💳 [${issuer}] ${cardName}` : `💳 ${cardName}`;
    }

    function escJs(str) {
        return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    document.addEventListener("DOMContentLoaded", () => {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById("form-date").value = `${yyyy}-${mm}-${dd}`;

        // 버전 배지 강제 표시
        const badge = document.getElementById('app-version');
        if (badge && !badge.textContent.trim()) {
            badge.textContent = 'v1.0.64';
        }
        fetchAppVersion();

        renderAll();
        populateFormCards();

        // 알림 클릭 등으로 진입
        tryOpenRemainingListFromContext();

        // 일정 저장 동기화 + 홈 진입 시 지난 일정 팝업
        scheduleRemainingNotifications();
        setTimeout(() => checkDueInAppAlertPopup(), 300);
    });

    function tryOpenRemainingListFromContext() {
        const params = new URLSearchParams(location.search);
        const fromQuery = params.get('open') === 'remaining-list' || params.get('open') === 'remaining-search';
        const fromStorage = sessionStorage.getItem('openRemainingList') === '1';
        if (fromQuery || fromStorage) {
            sessionStorage.removeItem('openRemainingList');
            if (fromQuery) {
                history.replaceState({}, '', location.pathname + location.hash);
            }
            setTimeout(() => openRemainingList(), 150);
            return true;
        }
        return false;
    }

    // 서비스 워커 → 알림 클릭 시 남은 혜택 화면 열기
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', (event) => {
            if (event.data && (event.data.type === 'OPEN_REMAINING_LIST' || event.data.type === 'OPEN_REMAINING_SEARCH')) {
                sessionStorage.setItem('openRemainingList', '1');
                openRemainingList();
            }
        });
    }

    // 백그라운드에서 복귀 시 대기 중인 화면 전환 처리
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            tryOpenRemainingListFromContext();
        }
    });
    window.addEventListener('pageshow', () => {
        tryOpenRemainingListFromContext();
    });
    window.addEventListener('focus', () => {
        tryOpenRemainingListFromContext();
    });

    // 외부 클릭 시 옵션 드롭다운 닫기
    document.addEventListener("click", () => {
        const dropdown = document.getElementById("options-dropdown");
        if (dropdown && dropdown.classList.contains("show")) {
            dropdown.classList.remove("show");
        }
    });

    function toggleOptionsMenu(event) {
        event.stopPropagation();
        document.getElementById("options-dropdown").classList.toggle("show");
    }

    /* --- 카드 혜택 CSV 가져오기 --- */
    function triggerCardBenefitsImport() {
        document.getElementById("csv-import-input").click();
    }

    function importCardBenefitsCSV(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const text = e.target.result;
                const parsed = parseCSV(text);
                if (!parsed || Object.keys(parsed).length === 0) {
                    alert("유효한 카드 혜택 데이터를 찾지 못했습니다. CSV 형식을 확인해 주세요.");
                    return;
                }
                cardBenefitsData = parsed;
                localStorage.setItem('card_picker_cherry_benefits', JSON.stringify(cardBenefitsData));
                // 기존 카드 순서 유지, 신규 카드만 맨 아래 추가
                const prevOrder = JSON.parse(localStorage.getItem('card_order_cherry') || 'null');
                const allNames = Object.keys(cardBenefitsData);
                let nextOrder;
                if (Array.isArray(prevOrder) && prevOrder.length) {
                    nextOrder = prevOrder.filter(c => allNames.includes(c));
                    allNames.forEach(c => { if (!nextOrder.includes(c)) nextOrder.push(c); });
                } else {
                    nextOrder = allNames;
                }
                localStorage.setItem('card_order_cherry', JSON.stringify(nextOrder));
                renderAll();
                populateFormCards();
                const names = nextOrder;
                alert(`카드 혜택을 성공적으로 불러왔습니다!\n총 ${names.length}개 카드\n\n${names.map(n => '· ' + n).join('\n')}`);
            } catch (err) {
                alert("CSV 파일을 읽는 중 오류가 발생했습니다: " + err.message);
            }
            event.target.value = "";
        };
        reader.readAsText(file, 'UTF-8');
    }

    function parseCSV(text) {
        const lines = text.trim().replace(/^\uFEFF/, '').split(/\r?\n/);
        if (lines.length < 2) return null;

        // BOM 제거 + 헤더 매핑
        const headers = parseCSVLine(lines[0]).map(h => h.trim().replace(/^\uFEFF/, ''));
        const idx = (name) => headers.indexOf(name);
        // 발급처(구 카드사), 한도(구 월간한도) 모두 인식
        let iIssuer = idx('발급처');
        if (iIssuer < 0) iIssuer = idx('카드사');
        let iCard = idx('카드명');
        let iTier = idx('실적');
        let iName = idx('혜택명');
        let iType = idx('할인유형');
        let iRate = idx('할인율또는금액');
        let iLimit = idx('한도');
        if (iLimit < 0) iLimit = idx('월간한도');
        let iOpt = idx('옵션');
        let iProvider = idx('제공');
        let iPeriod = idx('기간');
        let iPerfMonths = idx('실적산정기간');
        let iGrade = idx('등급');
        let iIntegrated = idx('통합 한도');
        if (iIntegrated < 0) iIntegrated = idx('통합한도');

        // 헤더를 못 찾은 경우: 열 개수로 포맷 추정
        if (iCard < 0) {
            const sample = parseCSVLine(lines[1] || '');
            if (headers[0] === '카드사' || headers[0] === '발급처' || sample.length >= 8) {
                // 구: 카드사,카드명,... 또는 신: 카드명,...발급처
                if (headers[0] === '카드사' || headers[0] === '발급처') {
                    iIssuer = 0; iCard = 1; iTier = 2; iName = 3;
                    iType = 4; iRate = 5; iLimit = 6; iOpt = 7;
                } else {
                    iCard = 0; iTier = 1; iName = 2; iType = 3;
                    iRate = 4; iLimit = 5; iOpt = 6; iIssuer = 7;
                }
            } else {
                iIssuer = -1; iCard = 0; iTier = 1; iName = 2;
                iType = 3; iRate = 4; iLimit = 5; iOpt = 6;
            }
        }

        const cards = {};
        const issuers = {};

        for (let i = 1; i < lines.length; i++) {
            const cols = parseCSVLine(lines[i]);
            if (cols.length < 5) continue;

            const issuer = iIssuer >= 0 ? (cols[iIssuer] || '').trim() : '';
            const cardName = (cols[iCard] || '').trim();
            const tier = (cols[iTier] || '').trim();
            const benefitName = (cols[iName] || '').trim();
            const type = (cols[iType] || '').trim();
            const rate = (cols[iRate] || '').trim();
            const limit = (cols[iLimit] || '').trim();
            const option = iOpt >= 0 ? (cols[iOpt] || '').trim() : '';
            const provider = iProvider >= 0 ? (cols[iProvider] || '').trim() : '';
            const period = iPeriod >= 0 ? (cols[iPeriod] || '').trim() : '';
            const perfMonthsRaw = iPerfMonths >= 0 ? (cols[iPerfMonths] || '').trim() : '';
            const perfMonths = perfMonthsRaw ? (parseInt(perfMonthsRaw, 10) || 0) : 0;
            const grade = iGrade >= 0 ? (cols[iGrade] || '').trim() : '';
            const integratedGroup = iIntegrated >= 0 ? (cols[iIntegrated] || '').trim() : '';

            // 카드명 자리에 발급처만 들어온 잘못된 매핑 방지
            if (!cardName || !tier || !benefitName) continue;
            if (cardName === issuer) continue;

            if (issuer) issuers[cardName] = issuer;
            if (!cards[cardName]) cards[cardName] = {};
            if (!cards[cardName][tier]) cards[cardName][tier] = [];

            cards[cardName][tier].push({
                name: benefitName,
                type: type,
                rate: rate,
                limit: limit,
                option: option,
                provider: provider,
                period: period,
                perfMonths: perfMonths,
                grade: grade,
                integratedGroup: integratedGroup
            });
        }

        if (Object.keys(issuers).length > 0) {
            cardIssuers = issuers;
            localStorage.setItem('card_picker_cherry_issuers', JSON.stringify(issuers));
        }

        return cards;
    }

    function parseCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += char;
            }
        }
        result.push(current);
        return result;
    }

    /* --- 데이터 내보내기 & 사용 기록 가져오기 --- */
    function exportData() {
        const exportObj = {
            version: "2.0",
            exportDate: new Date().toISOString(),
            cardBenefitsData: cardBenefitsData,
            benefitData: benefitData,
            performanceData: performanceData,
            cardDefaults: cardDefaults,
            monthlyOptions: monthlyOptions,
            monthlyGrades: monthlyGrades,
            cardIssuers: cardIssuers,
            cardOrder: JSON.parse(localStorage.getItem("card_order_cherry")) || []
        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
        const downloadAnchor = document.createElement("a");
        const yyyymmdd = new Date().toISOString().slice(0, 10).replace(/-/g, "");

        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `card_picker_cherry_backup_${yyyymmdd}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function triggerImport() {
        document.getElementById("import-file-input").click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const imported = JSON.parse(e.target.result);
                if (imported.benefitData) {
                    benefitData = imported.benefitData;
                    if (imported.performanceData) performanceData = imported.performanceData;
                    if (imported.cardBenefitsData) {
                        cardBenefitsData = imported.cardBenefitsData;
                        localStorage.setItem('card_picker_cherry_benefits', JSON.stringify(cardBenefitsData));
                    }
                    if (imported.cardDefaults) {
                        cardDefaults = imported.cardDefaults;
                        localStorage.setItem('card_picker_cherry_defaults', JSON.stringify(cardDefaults));
                    }
                    if (imported.monthlyOptions) {
                        monthlyOptions = imported.monthlyOptions;

    function getMonthOptions(month, cardName) {
        const m = (monthlyOptions[month] || {})[cardName];
        if (m && typeof m === 'object') return m;
        return (cardDefaults[cardName] || {}).selectedOptionBenefits || {};
    }

    function getMonthGrades(month, cardName) {
        const m = (monthlyGrades[month] || {})[cardName];
        if (Array.isArray(m)) return m;
        return (cardDefaults[cardName] || {}).selectedGrades || [];
    }

    function changeMonthOption(cardName, optKey, benefitName) {
        const selectedMonth = document.getElementById('month-spinner').value;
        if (!selectedMonth || selectedMonth === 'ALL') return;
        if (!monthlyOptions[selectedMonth]) monthlyOptions[selectedMonth] = {};
        if (!monthlyOptions[selectedMonth][cardName]) monthlyOptions[selectedMonth][cardName] = { ...getMonthOptions(selectedMonth, cardName) };
        if (benefitName) monthlyOptions[selectedMonth][cardName][optKey] = benefitName;
        else delete monthlyOptions[selectedMonth][cardName][optKey];
        saveData();
        renderMonthStatus(selectedMonth);
    }

    function changeMonthGrade(cardName, grade, checked) {
        const selectedMonth = document.getElementById('month-spinner').value;
        if (!selectedMonth || selectedMonth === 'ALL') return;
        if (!monthlyGrades[selectedMonth]) monthlyGrades[selectedMonth] = {};
        let list = Array.isArray(monthlyGrades[selectedMonth][cardName])
            ? [...monthlyGrades[selectedMonth][cardName]]
            : [...getMonthGrades(selectedMonth, cardName)];
        if (checked) {
            if (!list.includes(grade)) list.push(grade);
        } else {
            list = list.filter(g => g !== grade);

        monthlyGrades[selectedMonth][cardName] = list;

    function renderNotifySchedulesUI() {
        const list = document.getElementById('notify-schedule-list');

            return;
        }
        list.innerHTML = notificationSchedules
            .slice()
            .sort((a, b) => a.day - b.day || a.hour - b.hour || (a.minute || 0) - (b.minute || 0))
            .map(s => `
                <div class="default-row" style="margin-bottom:6px;" data-notify-id="${s.id}">
                    <span style="font-size:0.85rem;">매월 <strong>${s.day}일</strong> <strong>${formatNotifyTime(s.hour, s.minute)}</strong></span>
                    <button type="button" class="delete-btn" onclick="removeNotifySchedule('${s.id}')">삭제</button>
                </div>
            `).join('');
    }

    function addNotifySchedule() {
        const dayEl = document.getElementById('notify-day');
        const hourEl = document.getElementById('notify-hour');
        const minuteEl = document.getElementById('notify-minute');
        const day = parseInt(dayEl.value, 10);
        const hour = parseInt(hourEl.value, 10);
        const minute = parseInt(minuteEl ? minuteEl.value : '0', 10);
        if (!day || day < 1 || day > 31) {
            alert('일자는 1~31 사이로 입력해 주세요.');
            return;
        }
        if (isNaN(hour) || hour < 0 || hour > 23) {
            alert('시는 0~23 사이로 입력해 주세요.');
            return;
        }
        if (isNaN(minute) || minute < 0 || minute > 59) {
            alert('분은 0~59 사이로 입력해 주세요.');
            return;
        }
        const exists = notificationSchedules.some(s =>
            s.day === day && s.hour === hour && (s.minute || 0) === minute
        );
        if (exists) {
            alert('이미 같은 일정이 있습니다.');
            return;
        }
        notificationSchedules.push({
            id: 'n' + Date.now(),
            day,
            hour,
            minute
        });
        renderNotifySchedulesUI();
    }

    function removeNotifySchedule(id) {
        notificationSchedules = notificationSchedules.filter(s => s.id !== id);
        renderNotifySchedulesUI();
    }

    function getNextTriggerTimestamp(day, hour, minute) {
        const now = new Date();
        let y = now.getFullYear();
        let m = now.getMonth();
        const min = minute || 0;
        // 이번 달 해당 일자·시·분
        let target = new Date(y, m, Math.min(day, daysInMonth(y, m)), hour, min, 0, 0);
        if (target.getTime() <= now.getTime()) {
            // 다음 달
            m += 1;
            if (m > 11) { m = 0; y += 1; }
            target = new Date(y, m, Math.min(day, daysInMonth(y, m)), hour, min, 0, 0);
        }
        return target.getTime();
    }

    function daysInMonth(year, monthIndex) {
        return new Date(year, monthIndex + 1, 0).getDate();
    }

    /* 홈 화면 진입 시: 설정한 일정이 지났으면 월 1회 팝업 */
    function checkDueInAppAlertPopup() {
        if (!notificationSchedules.length) return;

        // 상세/검색/남은혜택 화면이 떠 있으면 홈이 아님
        const remainingTab = document.getElementById('tab-remaining');
        const detailTab = document.getElementById('tab-detail');
        if (remainingTab && remainingTab.classList.contains('active')) return;
        if (detailTab && detailTab.classList.contains('active')) return;

        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth();
        const monthKey = `${y}-${String(m + 1).padStart(2, '0')}`;

        // 가장 이른 지난 일정 하나 팝업
        const due = notificationSchedules
            .map(s => {
                const day = Math.min(s.day, daysInMonth(y, m));
                const at = new Date(y, m, day, s.hour, s.minute || 0, 0, 0);
                return { s, at };
            })
            .filter(({ s, at }) => {
                if (at.getTime() > now.getTime()) return false;
                const fireKey = `popup-${s.id}@${monthKey}`;
                return !notifyLastFired[fireKey];
            })
            .sort((a, b) => a.at - b.at);

        if (!due.length) return;

        const { s } = due[0];
        const fireKey = `popup-${s.id}@${monthKey}`;
        notifyLastFired[fireKey] = true;
        localStorage.setItem('card_picker_cherry_notify_fired', JSON.stringify(notifyLastFired));

        showRemainingAlertPopup();
    }

    /* 최근 3개월 사용 이력 필터 + 이 달 남은 혜택 수집 */
    function getThreeMonthsAgoDate() {
        const d = new Date();
        d.setHours(0, 0, 0, 0);
        d.setMonth(d.getMonth() - 3);
        return d;
    }

    function hasUsageInLastThreeMonths() {
        const from = getThreeMonthsAgoDate();
        return (benefitData || []).some(item => {
            const t = new Date(item.date);
            return !isNaN(t.getTime()) && t >= from;
        });
    }

    function wasBenefitUsedInLastThreeMonths(cardName, benefitName) {
        const from = getThreeMonthsAgoDate();
        return (benefitData || []).some(item => {
            if (item.cardName !== cardName || item.benefitName !== benefitName) return false;
            const t = new Date(item.date);
            return !isNaN(t.getTime()) && t >= from;
        });
    }

    // applyThreeMonthFilter === true 일 때만 알림 본문용 3개월 필터 적용
    // 화면(이 달의 남은 혜택)은 반드시 false 로 호출
    // 통합 한도는 카드+한도키 단위로 1건 묶음, 무제한은 정렬 시 맨 아래
    function collectRemainingBenefits(month, applyThreeMonthFilter) {
        if (!cardBenefitsData) return [];
        const monthPerf = performanceData[month] || {};
        const applyUsageFilter = applyThreeMonthFilter === true && hasUsageInLastThreeMonths();
        const results = [];

        getCardOrder().forEach(cardName => {
            const tiers = cardBenefitsData[cardName];
            if (!tiers) return;
            // 카드사 상품은 연결 카드 경유로만 집계
            if (getCardProviderType(cardName) === '카드사') return;
            const tierKeys = getTierKeys(tiers);
            const defaults = cardDefaults[cardName] || {};
            let selectedTier = monthPerf[cardName] || defaults.defaultTier || tierKeys[0];
            if (!tierKeys.includes(selectedTier)) selectedTier = tierKeys[0];

            const providerTypeRem = getCardProviderType(cardName);
            let benefits = [];

            // 멤버십사: 실적 구간 무시, 등급만 적용 (현황과 동일)
            if (providerTypeRem === '멤버십사') {
                const all = [];
                Object.keys(tiers).forEach(tk => all.push(...(tiers[tk] || [])));
                benefits = filterBenefitsByGrade(all, cardName, month);
            } else {
                // 일반 카드: 해당 월 전월실적 + 옵션 + 등급
                benefits = filterBenefitsByOption(
                    getBenefitsForTier(tiers, selectedTier),
                    cardName,
                    month
                );
                benefits = filterBenefitsByGrade(benefits, cardName, month);
            }

            // 연결 카드사 혜택: 평균 실적 + 등급
            const linkedProduct = defaults.linkedCompanyProduct || '';
            if (providerTypeRem !== '카드사' && providerTypeRem !== '멤버십사' && linkedProduct && cardBenefitsData[linkedProduct]) {
                const companyTiers = cardBenefitsData[linkedProduct];
                const seenC = new Set();
                const grades = getMonthGrades(month, linkedProduct);
                Object.keys(companyTiers).forEach(tk => {
                    (companyTiers[tk] || []).forEach(b => {
                        const key = b.name + '|' + (b.limit || '');
                        if (seenC.has(key)) return;
                        seenC.add(key);
                        const need = parseTierAmount(tk);
                        const n = b.perfMonths > 0 ? b.perfMonths : 1;
                        const avg = getAveragePerformanceAmount(cardName, month, n);
                        if (need > avg) return;
                        const g = (b.grade || '').trim();
                        if (g && !grades.includes(g)) return;
                        benefits.push({ ...b, _fromCompany: linkedProduct });
                    });
                });
            }

            const seenIntegrated = new Set();

            benefits.forEach(ben => {
                // —— 통합 한도: 같은 카드·같은 한도 문자열은 한 줄로 ——
                if (isIntegratedLimit(ben)) {
                    const ikey = cardName + '|' + getIntegratedGroupKey(ben);
                    if (seenIntegrated.has(ikey)) return;
                    seenIntegrated.add(ikey);

                    const group = benefits.filter(b => isIntegratedLimit(b) && getIntegratedGroupKey(b) === getIntegratedGroupKey(ben));
                    let groupForFilter = group;
                    if (applyThreeMonthFilter === true && applyUsageFilter) {
                        groupForFilter = group.filter(b =>
                            wasBenefitUsedInLastThreeMonths(cardName, b.name)
                        );
                        if (!groupForFilter.length) return;
                    }

                    const groupNames = group.map(b => b.name);
                    const usagePrefix = getUsagePeriodPrefix(month, ben.period);
                    const used = benefitData
                        .filter(item => item.cardName === cardName &&
                                        groupNames.includes(item.benefitName) &&
                                        item.date.startsWith(usagePrefix))
                        .reduce((sum, item) => sum + item.amount, 0);

                    const limitNum = parseLimitAmount(ben.limit);
                    const unit = getUnitLabel(ben.rate, ben.limit);
                    const isUnlimited = !limitNum;
                    const isMileage = isMileageUnit(ben.rate, ben.limit);
                    const remain = isUnlimited ? null : Math.max(0, limitNum - used);
                    if (!isUnlimited && remain <= 0) return;

                    const displayNames = (applyThreeMonthFilter === true && applyUsageFilter)
                        ? groupForFilter.map(b => b.name)
                        : groupNames;

                    results.push({
                        cardName,
                        isIntegrated: true,
                        names: displayNames,
                        benefit: {
                            name: displayNames.join(' · '),
                            type: '통합',
                            rate: group.map(b => b.rate).filter(Boolean).join(' / '),
                            limit: ben.limit
                        },
                        used,
                        remain,
                        limitNum,
                        unit,
                        isUnlimited,
                        isMileage,
                        // 하단 그룹(무제한·마일리지)은 remainScore 미사용
                        remainScore: (isUnlimited || isMileage) ? -1 : remain
                    });
                    return;
                }

                // —— 일반 혜택 ——
                if (applyThreeMonthFilter === true && applyUsageFilter &&
                    !wasBenefitUsedInLastThreeMonths(cardName, ben.name)) return;

                const usagePrefix = getUsagePeriodPrefix(month, ben.period);
                const used = benefitData
                    .filter(item => item.cardName === cardName &&
                                    item.benefitName === ben.name &&
                                    item.date.startsWith(usagePrefix))
                    .reduce((sum, item) => sum + item.amount, 0);

                const limitNum = parseLimitAmount(ben.limit);
                const unit = getUnitLabel(ben.rate, ben.limit);
                const isUnlimited = !limitNum;
                const isMileage = isMileageUnit(ben.rate, ben.limit);
                const remain = isUnlimited ? null : Math.max(0, limitNum - used);
                if (!isUnlimited && remain <= 0) return;

                results.push({
                    cardName,
                    isIntegrated: false,
                    names: [ben.name],
                    benefit: ben,
                    used,
                    remain,
                    limitNum,
                    unit,
                    isUnlimited,
                    isMileage,
                    remainScore: (isUnlimited || isMileage) ? -1 : remain
                });
            });
        });

        // 잔여 많은 순 / 한도 무제한·마일리지는 맨 아래
        results.sort((a, b) => {
            const aBottom = !!(a.isUnlimited || a.isMileage);
            const bBottom = !!(b.isUnlimited || b.isMileage);
            if (aBottom && !bBottom) return 1;
            if (!aBottom && bBottom) return -1;
            if (!aBottom && !bBottom) {
                return b.remainScore - a.remainScore || a.cardName.localeCompare(b.cardName);
            }
            // 하단 그룹 내부: 마일리지 먼저, 무제한 나중 / 카드명
            if (a.isMileage && b.isUnlimited && !b.isMileage) return -1;
            if (b.isMileage && a.isUnlimited && !a.isMileage) return 1;
            if (!a.isUnlimited && !b.isUnlimited) {
                return (b.remain || 0) - (a.remain || 0) || a.cardName.localeCompare(b.cardName);
            }
            return a.cardName.localeCompare(b.cardName);
        });
        return results;
    }

    function getTopRemainingBenefits(n) {
        // 알림 본문만 최근 3개월 사용 이력 필터 적용
        return collectRemainingBenefits(getCurrentYearMonth(), true).slice(0, n || 3);
    }

    function renderRemainingList() {
        const resultsEl = document.getElementById('remaining-list-results');
        if (!resultsEl) return;

        if (!cardBenefitsData || Object.keys(cardBenefitsData).length === 0) {
            resultsEl.innerHTML = '<div style="font-size:0.85rem;color:var(--text-muted);text-align:center;padding:20px;">카드 혜택 CSV를 먼저 가져와 주세요.</div>';
            return;
        }

        // 화면 정렬 규칙 그대로 (통합 묶음, 잔여 많은 순, 무제한·마일리지 하단)
        let results = collectRemainingBenefits(getCurrentYearMonth(), false);

        const kw = (document.getElementById('remaining-list-search-input')?.value || '').trim().toLowerCase();
        if (kw) {
            results = results.filter(r => {
                const hay = [
                    r.cardName,
                    r.benefit?.name || '',
                    r.benefit?.rate || '',
                    r.benefit?.type || '',
                    ...(r.names || [])
                ].join(' ').toLowerCase();
                return hay.includes(kw);
            });
        }

        if (!results.length) {
            resultsEl.innerHTML = '<div style="font-size:0.85rem;color:var(--text-muted);text-align:center;padding:20px;">' +
                (kw ? '검색 결과가 없습니다.' : '남은 혜택이 없습니다.') + '</div>';
            return;
        }

        resultsEl.innerHTML = results.map(r => {
            const remainText = r.isUnlimited
                ? `사용 ${r.used.toLocaleString()}${r.unit} · 한도 없음`
                : `잔여 ${r.remain.toLocaleString()}${r.unit} / ${r.limitNum.toLocaleString()}${r.unit}`;
            const companyName = r.benefit?._fromCompany || '';
            const isCompanyRem = (r.benefit?.provider || '') === '카드사' || !!companyName;
            const namePrefix = r.isIntegrated ? '' : formatBenefitNamePrefix(r.benefit || {});
            const title = r.isIntegrated
                ? `🔗 통합 한도 · ${(r.names || []).map(n => getBenefitEmoji(n) + ' ' + n).join(' · ')}`
                : `${getBenefitEmoji(r.benefit.name)} ${namePrefix}${r.benefit.name}`;
            const meta = r.isIntegrated
                ? `${r.benefit.rate || '-'} · 통합`
                : `${r.benefit.rate || '-'} · ${isCompanyRem ? '카드사혜택' : (r.benefit.type || '')}`;
            // 연간 혜택: 사용/잔여 표기에 연·년 표시
            const isAnnual = (r.benefit?.period || '').trim() === '연간';
            let remainDisplay = remainText;
            if (isAnnual && !r.isUnlimited) {
                remainDisplay = `사용: 연 ${r.used.toLocaleString()}${r.unit} / ${r.limitNum.toLocaleString()}${r.unit} · 잔여: ${r.remain.toLocaleString()}${r.unit} / 년`;
            } else if (isAnnual && r.isUnlimited) {
                remainDisplay = `사용: 연 ${r.used.toLocaleString()}${r.unit} · 한도 없음`;
            }
            return `<div class="search-result-item">
                <div class="sr-card">${formatCardLabel(r.cardName)}</div>
                <div class="sr-name">${title}</div>
                <div class="sr-meta">${meta}</div>
                <div class="sr-remain">${remainDisplay}</div>
            </div>`;
        }).join('');
    }

        const blocks = document.querySelectorAll('#card-defaults-body .default-card-block[data-card]');
        blocks.forEach(block => {
            const cardName = block.getAttribute('data-card');
            const tierSelect = block.querySelector('.default-tier-select');
            const optionSelects = block.querySelectorAll('.option-benefit-select');
            const selectedOptionBenefits = {};
            optionSelects.forEach(sel => {
                const opt = sel.getAttribute('data-option');
                if (sel.value) selectedOptionBenefits[opt] = sel.value;
            });

            const companySel = block.querySelector('.company-link-select');
            const gradeChecks = block.querySelectorAll('.grade-check:checked');
            const selectedGrades = Array.from(gradeChecks).map(c => c.value);
            cardDefaults[cardName] = {
                defaultTier: tierSelect ? tierSelect.value : '',
                selectedOptionBenefits: selectedOptionBenefits,
                selectedGrades: selectedGrades,
                linkedCompanyProduct: companySel ? (companySel.value || '') : (cardDefaults[cardName] && cardDefaults[cardName].linkedCompanyProduct) || ''
            };
        });
        saveData();
        scheduleRemainingNotifications();
        closeCardDefaultsModal();
        const selectedMonth = document.getElementById('month-spinner').value;
        if (selectedMonth !== 'ALL' && cardBenefitsData) {
            renderMonthStatus(selectedMonth);
        }

    }

    function getCurrentYearMonth() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        return `${y}-${m}`;
    }

    /* 다음 달 YYYY-MM (앱 실행일 기준) */
    function getNextYearMonth() {
        const now = new Date();
        let y = now.getFullYear();
        let m = now.getMonth() + 2; // 다음 달 (0-based + 1 + 1)
        if (m > 12) { m = 1; y += 1; }
        return `${y}-${String(m).padStart(2, '0')}`;
    }

    function formatYearMonthLabel(ym) {
        if (!ym || !/^\d{4}-\d{2}$/.test(ym)) return ym || '';
        const [y, m] = ym.split('-');
        return `${y}년 ${parseInt(m, 10)}월`;
    }

    /* 사용 기록·전월 실적 있는 달 + 당월 + 다음 달(실적 미리 등록용) */
    function getAvailableMonths() {
        const set = new Set();
        set.add(getCurrentYearMonth());
        set.add(getNextYearMonth());
        (benefitData || []).forEach(item => {
            if (item.date && String(item.date).length >= 7) {
                set.add(String(item.date).slice(0, 7));
            }
        });
        Object.keys(performanceData || {}).forEach(ym => {
            if (!/^\d{4}-\d{2}$/.test(ym)) return;
            const cards = performanceData[ym] || {};
            if (Object.keys(cards).length > 0) set.add(ym);
        });
        // 월별 옵션/등급만 있어도 조회 가능하게
        Object.keys(monthlyOptions || {}).forEach(ym => {
            if (/^\d{4}-\d{2}$/.test(ym) && monthlyOptions[ym] && Object.keys(monthlyOptions[ym]).length) set.add(ym);
        });
        Object.keys(monthlyGrades || {}).forEach(ym => {
            if (/^\d{4}-\d{2}$/.test(ym) && monthlyGrades[ym] && Object.keys(monthlyGrades[ym]).length) set.add(ym);
        });
        return Array.from(set).sort((a, b) => b.localeCompare(a));
    }

    function populateMonthSpinners(preferMonth) {
        const months = getAvailableMonths();
        const current = getCurrentYearMonth();
        const statusSel = document.getElementById('month-spinner');
        const recordSel = document.getElementById('record-month-spinner');

        const prevStatus = preferMonth || (statusSel && statusSel.value) || current;
        const prevRecord = (recordSel && recordSel.value) || 'ALL';

        if (statusSel) {
            let html = '<option value="ALL">전체 (월별 추이 그래프)</option>';
            months.forEach(ym => {
                html += `<option value="${ym}">${formatYearMonthLabel(ym)}</option>`;
            });
            statusSel.innerHTML = html;
            // 이전 선택 유지, 없으면 당월, 없으면 가장 최근 월
            // 기본은 당월. 사용자가 전체를 고른 경우에만 ALL 유지
            if (prevStatus === 'ALL' && statusSel.dataset.userChoseAll === '1') {
                statusSel.value = 'ALL';
            } else if (prevStatus && prevStatus !== 'ALL' && months.includes(prevStatus)) {
                statusSel.value = prevStatus;
            } else if (months.includes(current)) {
                statusSel.value = current;
            } else if (months.length) {
                statusSel.value = months[0];
            }
        }

        if (recordSel) {
            let html = '<option value="ALL">전체</option>';
            months.forEach(ym => {
                html += `<option value="${ym}">${formatYearMonthLabel(ym)}</option>`;
            });
            recordSel.innerHTML = html;
            // 기본은 당월 (이전이 전체/무효면 당월)
            if (prevRecord && prevRecord !== 'ALL' && months.includes(prevRecord)) {
                recordSel.value = prevRecord;
            } else if (months.includes(current)) {
                recordSel.value = current;
            } else if (months.length) {
                recordSel.value = months[0];
            } else {
                recordSel.value = 'ALL';
            }
        }
    }

    function getRateScore(rateStr) {
        const s = String(rateStr || '');
        const pctMatches = [...s.matchAll(/(\d+(?:\.\d+)?)\s*%/g)].map(m => parseFloat(m[1]));
        if (pctMatches.length) return Math.max(...pctMatches);
        // 정액/마일은 %보다 낮게
        const won = s.match(/(\d+)\s*원/);
        if (won) return parseInt(won[1], 10) / 100000;
        const mile = s.match(/(\d+)\s*마일/);
        if (mile) return parseInt(mile[1], 10) / 1000;
        return 0;
    }
