    /* --- 한도 숫자 추출 (회/매/장/원/마일) --- */
    function parseLimitAmount(limitStr) {
        if (!limitStr || limitStr === '무제한' || String(limitStr).trim() === '') return null;
        const s = String(limitStr).replace(/,/g, '');
        // 회당만 있고 횟수 한도가 없으면 기간 한도 없음
        if (/회당/.test(s) && !/\d+\s*회(?!당)/.test(s) && !/\d+\s*매/.test(s) && !/\d+\s*장/.test(s)) {
            const maxWon = s.match(/최대\s*(\d+)\s*만?원/);
            if (maxWon) {
                let n = parseInt(maxWon[1], 10);
                if (/최대\s*\d+\s*만원/.test(s)) n *= 10000;
                return n;
            }
            return null;
        }
        // 횟수/장수 한도 우선 (회당 제외)
        const cnt = s.match(/(\d+)\s*회(?!당)/);
        if (cnt) return parseInt(cnt[1], 10);
        const mae = s.match(/(\d+)\s*매/);
        if (mae) return parseInt(mae[1], 10);
        const jang = s.match(/(\d+)\s*장/);
        if (jang) return parseInt(jang[1], 10);
        const mile = s.match(/(\d+)\s*마일/);
        if (mile) return parseInt(mile[1], 10);
        // 원 한도: 12000원, 1.2만원
        const man = s.match(/(\d+(?:\.\d+)?)\s*만원/);
        if (man) return Math.round(parseFloat(man[1]) * 10000);
        const won = s.match(/(\d+)\s*원/);
        if (won) return parseInt(won[1], 10);
        return null;
    }

    function isMileageUnit(rate, limit) {
        const s = `${rate || ''} ${limit || ''}`;
        return /마일/.test(s);
    }

    function getUnitLabel(rate, limit) {
        if (isMileageUnit(rate, limit)) return '마일';
        const lim = String(limit || '');
        // parseLimitAmount와 동일한 우선순위
        if (/(\d+)\s*회/.test(lim)) return '회';
        if (/(\d+)\s*매/.test(lim)) return '매';
        if (/(\d+)\s*장/.test(lim)) return '장';
        if (/(\d+)\s*원/.test(lim)) return '원';
        if (/매/.test(lim)) return '매';
        if (/장/.test(lim)) return '장';
        if (/회/.test(lim)) return '회';
        return '원';
    }

    function buildBenefitTagsHtml(ben) {
        const tags = [];
        if (ben._fromCompany || ben.provider === '카드사') {
            tags.push(['카드사혜택', 'type-카드사혜택']);
        }
        const t = (ben.type || '').trim();
        if (t && t !== '카드사혜택' && t !== '통합') {
            tags.push([t, 'type-' + t.replace(/\s/g, '')]);
        }
        if (!tags.length && t) {
            tags.push([t, 'type-' + t.replace(/\s/g, '')]);
        }
        if (!tags.length) return '';
        return '<span class="type-tags">' + tags.map(([label, cls]) =>
            `<span class="type ${cls}">${label}</span>`
        ).join('') + '</span>';
    }

    function formatBenefitNamePrefix(ben) {
        let s = '';
        if (ben._fromCompany) s += '[' + ben._fromCompany + '] ';
        if (ben.option && String(ben.option).trim()) s += '[옵션' + String(ben.option).trim() + '] ';
        if (ben.grade && String(ben.grade).trim()) s += '[' + String(ben.grade).trim() + '] ';
        return s;
    }

    function isIntegratedLimit(benOrLimit) {
        // 혜택 객체: integratedGroup 우선 / 구버전: 한도 문자열에 '통합'
        if (benOrLimit && typeof benOrLimit === 'object') {
            if (benOrLimit.integratedGroup && String(benOrLimit.integratedGroup).trim()) return true;
            return !!(benOrLimit.limit && String(benOrLimit.limit).includes('통합'));
        }
        return !!(benOrLimit && String(benOrLimit).includes('통합'));
    }

    function getIntegratedGroupKey(ben) {
        if (!ben) return '';
        const g = (ben.integratedGroup || '').trim();
        if (g) return g;
        // 구버전 호환: 한도 문자열 자체
        return (ben.limit || '').trim();
    }

    /* 결제금액 + 할인율/금액 식으로 혜택 수치 계산 */
    /* 혜택 한도 숫자 (현재 월 실적 티어 기준 메타 우선) */
    function getBenefitLimitNum(cardName, benefitName, dateStr) {
        const meta = findBenefitMetaForMonth(cardName, benefitName, dateStr);
        if (!meta) return null;
        return parseLimitAmount(meta.limit);
    }

    /* 월 실적에 맞는 혜택 메타 (없으면 일반 findBenefitMeta) */
    function findBenefitMetaForMonth(cardName, benefitName, dateStr) {
        if (!cardBenefitsData || !benefitName) return findBenefitMeta(cardName, benefitName);
        const monthKey = dateStr ? String(dateStr).slice(0, 7) : '';
        const searchCards = [cardName];
        const linked = getLinkedCompanyProduct(cardName);
        if (linked) searchCards.push(linked);

        if (monthKey && cardBenefitsData[cardName]) {
            const tiers = cardBenefitsData[cardName];
            const tierKeys = getTierKeys(tiers);
            const defaults = cardDefaults[cardName] || {};
            const monthPerf = performanceData[monthKey] || {};
            let selectedTier = monthPerf[cardName] || defaults.defaultTier || tierKeys[0];
            if (!tierKeys.includes(selectedTier)) selectedTier = tierKeys[0];
            const inTier = (tiers[selectedTier] || []).find(b => b.name === benefitName);
            if (inTier) return inTier;
        }
        return findBenefitMeta(cardName, benefitName);
    }

    /* 통합 그룹에 속하는 혜택명 목록 */
    function getIntegratedBenefitNames(cardName, benefitName) {
        const meta = findBenefitMeta(cardName, benefitName);
        if (!meta || !isIntegratedLimit(meta)) return [benefitName];
        const gkey = getIntegratedGroupKey(meta);
        const names = new Set([benefitName]);
        const products = [cardName];
        const linked = getLinkedCompanyProduct(cardName);
        if (linked) products.push(linked);
        products.forEach(cn => {
            const tiers = cardBenefitsData && cardBenefitsData[cn];
            if (!tiers) return;
            Object.values(tiers).forEach(list => {
                (list || []).forEach(b => {
                    if (isIntegratedLimit(b) && getIntegratedGroupKey(b) === gkey) {
                        names.add(b.name);
                    }
                });
            });
        });
        return Array.from(names);
    }

    /* 해당 혜택(또는 통합 그룹)의 기간 내 기사용 금액 */
    function getUsedAmountForBenefit(cardName, benefitName, dateStr, excludeId) {
        const meta = findBenefitMetaForMonth(cardName, benefitName, dateStr) || findBenefitMeta(cardName, benefitName);
        if (!meta) return 0;
        const monthKey = dateStr ? String(dateStr).slice(0, 7) : '';
        if (!monthKey) return 0;
        const usagePrefix = getUsagePeriodPrefix(monthKey, meta.period);
        if (!usagePrefix) return 0;

        const names = getIntegratedBenefitNames(cardName, benefitName);

        return (benefitData || [])
            .filter(item => {
                if (excludeId != null && String(item.id) === String(excludeId)) return false;
                if (item.cardName !== cardName) return false;
                if (!names.includes(item.benefitName)) return false;
                return item.date && String(item.date).startsWith(usagePrefix);
            })
            .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
    }

    /* 남은 한도 (한도 없으면 null = 무제한) */
    function getRemainingLimit(cardName, benefitName, dateStr, excludeId) {
        const limitNum = getBenefitLimitNum(cardName, benefitName, dateStr);
        if (limitNum == null) return null;
        const used = getUsedAmountForBenefit(cardName, benefitName, dateStr, excludeId);
        return Math.max(0, limitNum - used);
    }

    /* 한도 초과 시 남은 한도까지만 적용 (0이 아니라 잔여분) */
    function capBenefitByRemainingLimit(cardName, benefitName, amount, dateStr, excludeId) {
        const raw = Math.max(0, Number(amount) || 0);
        if (raw <= 0) return 0;
        const remain = getRemainingLimit(cardName, benefitName, dateStr, excludeId);
        if (remain == null) return raw; // 무제한
        // 남은 한도가 있으면 그 범위 안, 없으면 0
        return Math.min(raw, remain);
    }

    function calculateBenefitAmount(payment, rateStr, limitStr) {
        if (!rateStr || payment == null || payment < 0) return 0;
        const rate = String(rateStr).replace(/\s/g, '');
        let benefit = 0;

        // 마일리지: "1마일/1000원", "2마일/1000원"
        const mileMatch = rate.match(/(\d+)\s*마일\s*\/\s*(\d+)\s*원/);
        if (mileMatch) {
            const per = parseInt(mileMatch[1], 10);
            const base = parseInt(mileMatch[2], 10) || 1000;
            benefit = Math.floor(payment / base) * per;
        }
        // 정액: "2000원", "6000원"
        else if (/^\d+원$/.test(rate)) {
            benefit = parseInt(rate, 10) || 0;
        }
        // 비율: "10%", "50%", "5%"
        else if (/%$/.test(rate) || rate.includes('%')) {
            const pctMatch = rate.match(/(\d+(?:\.\d+)?)\s*%/);
            if (pctMatch) {
                benefit = Math.floor(payment * parseFloat(pctMatch[1]) / 100);
            }
        }
        // "50%•30%" 같은 복합은 첫 비율 사용
        else {
            const pctMatch = rate.match(/(\d+(?:\.\d+)?)\s*%/);
            if (pctMatch) {
                benefit = Math.floor(payment * parseFloat(pctMatch[1]) / 100);
            } else {
                const numMatch = rate.match(/(\d+)/);
                if (numMatch) benefit = parseInt(numMatch[1], 10);
            }
        }

        // 기간 한도 캡은 capBenefitByRemainingLimit에서 기사용 반영 후 처리
        // (여기서 full limit으로 자르면 남은 한도 계산과 혼동됨)
        return Math.max(0, benefit);
    }

    function formatTierLabel(tier) {
        if (!tier) return '';
        const normalized = String(tier).replace(/\s/g, '');
        if (normalized === '0만원' || normalized === '0원' || normalized === '없음' || normalized === '__none__') {
            return '실적 없음';
        }
        return tier;
    }

    /* 모든 카드에 실적 없음(0만원) 티어 보장 */
    function getTierKeys(tiers) {
        const keys = Object.keys(tiers || {});
        if (!keys.includes('0만원')) {
            keys.push('0만원');
        }
        return keys.sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0));
    }

    function getBenefitsForTier(tiers, tier) {
        if (!tiers) return [];
        if (tier === '0만원' || tier === '__none__') {
            return tiers['0만원'] || [];
        }
        return tiers[tier] || [];
    }

    /* 제공 구분: 카드 / 카드사 / 멤버십사 (혜택 객체 또는 카드 전체) */
    function getCardProviderType(cardName) {
        const tiers = cardBenefitsData && cardBenefitsData[cardName];
        if (!tiers) return '';
        for (const list of Object.values(tiers)) {
            for (const b of list) {
                if (b.provider) return b.provider;
            }
        }
        return '카드';
    }

    function getProductNamesByProvider(provider) {
        if (!cardBenefitsData) return [];
        return Object.keys(cardBenefitsData).filter(n => getCardProviderType(n) === provider);
    }

    /* 등급 필터: 등급 없으면 기본 혜택, 있으면 selectedGrades에 포함된 것만 */
    function filterBenefitsByGrade(benefits, cardName, month) {
        const selected = month
            ? getMonthGrades(month, cardName)
            : ((cardDefaults[cardName] || {}).selectedGrades || []);
        return (benefits || []).filter(b => {
            const g = (b.grade || '').trim();
            if (!g) return true;
            return selected.includes(g);
        });
    }

    function filterBenefitsByOption(benefits, cardName, month) {
        const selectedOptionBenefits = month
            ? getMonthOptions(month, cardName)
            : ((cardDefaults[cardName] || {}).selectedOptionBenefits || {});
        return (benefits || []).filter(b => {
            if (!b.option || !b.option.trim()) return true;
            const chosen = selectedOptionBenefits[b.option];
            if (!chosen) return false;
            return b.name === chosen;
        });
    }

    function getLinkedCompanyProduct(cardName) {
        const d = cardDefaults[cardName] || {};
        return d.linkedCompanyProduct || '';
    }

    function parseTierAmount(tier) {
        if (tier == null || tier === '') return 0;
        const n = parseInt(String(tier).replace(/[^0-9]/g, ''), 10);
        return isNaN(n) ? 0 : n;
    }

    function getPreviousMonthKeys(ym, n) {
        if (!ym || !n || n <= 0) return [];
        const parts = String(ym).split('-');
        let y = parseInt(parts[0], 10);
        let m = parseInt(parts[1], 10);
        const keys = [];
        for (let i = 0; i < n; i++) {
            m -= 1;
            if (m < 1) { m = 12; y -= 1; }
            keys.push(y + '-' + String(m).padStart(2, '0'));
        }
        return keys;
    }

    function isAnnualPeriod(period) {
        return String(period || '').trim() === '연간';
    }

    /* 사용량 집계 기간 접두어: 연간이면 YYYY, 아니면 YYYY-MM */
    function getUsagePeriodPrefix(targetMonth, period) {
        if (isAnnualPeriod(period) && targetMonth) {
            return String(targetMonth).slice(0, 4); // 연도
        }
        return targetMonth;
    }

    function getAveragePerformanceAmount(cardName, targetMonth, months) {
        const n = months > 0 ? months : 1;
        const keys = getPreviousMonthKeys(targetMonth, n);
        const defaults = cardDefaults[cardName] || {};
        let sum = 0;
        let cnt = 0;
        keys.forEach(k => {
            const raw = (performanceData[k] || {})[cardName];
            if (raw != null && raw !== '') {
                sum += parseTierAmount(raw);
                cnt++;
            }
        });
        if (cnt === 0) {
            return parseTierAmount(defaults.defaultTier || '0만원');
        }
        return sum / cnt;
    }

    /* 선택 실적 이하(+0만원) 티어 혜택 합치기 */
    function getBenefitsUpToTier(tiers, selectedTier) {
        if (!tiers) return [];
        const sel = parseInt(String(selectedTier).replace(/[^0-9]/g, ''), 10) || 0;
        const seen = new Set();
        const out = [];
        Object.keys(tiers).forEach(tk => {
            const tv = parseInt(String(tk).replace(/[^0-9]/g, ''), 10) || 0;
            if (tv !== 0 && tv > sel) return;
            (tiers[tk] || []).forEach(b => {
                const key = b.name + '|' + (b.limit || '');
                if (seen.has(key)) return;
                seen.add(key);
                out.push(b);
            });
        });
        return out;
    }

    function isRateCalculable(rateStr) {
        const rate = String(rateStr || '').replace(/\s/g, '');
        if (!rate) return false;
        if (/최대|이상|이하|~|～|무료|1\+1|면제|서비스|차등|할인가/.test(rate)) return false;
        if (/\d+마일\s*\/\s*\d+원/.test(String(rateStr || '').replace(/\s/g, '')) || /\d+마일\/\d+원/.test(rate)) return true;
        if (/^\d+원$/.test(rate)) return true;
        if (/^\d+(\.\d+)?%$/.test(rate)) return true;
        // 단일 비율만
        const onlyPct = rate.match(/^(\d+(?:\.\d+)?)%$/);
        if (onlyPct) return true;
        return false;
    }

    function getBenefitEmoji(name) {
        if (!name) return '🏷️';
        const n = name.toLowerCase();
        if (/스타벅스|커피/.test(n)) return '☕';
        if (/대중교통|교통|버스|지하철|택시/.test(n)) return '🚌';
        if (/배달/.test(n)) return '🛵';
        if (/이동통신|통신|휴대폰|핸드폰/.test(n)) return '📱';
        if (/아파트|관리비/.test(n)) return '🏢';
        if (/주유|기름/.test(n)) return '⛽';
        if (/의료|병원|약국/.test(n)) return '🏥';
        if (/할인점|마트|이마트|편의점|다이소|올리브영/.test(n)) return '🛒';
        if (/스트리밍|넷플릭스|유튜브|영상/.test(n)) return '📺';
        if (/온라인쇼핑몰|쇼핑|패션|오늘의집/.test(n)) return '🛍️';
        if (/영화|시네마|롯데시네마/.test(n)) return '🎬';
        if (/마일|리워드|스카이패스/.test(n)) return '✈️';
        if (/해외|공항/.test(n)) return '✈️';
        if (/주차/.test(n)) return '🅿️';
        if (/간편결제|페이/.test(n)) return '💳';
        if (/적립|포인트/.test(n)) return '🪙';
        if (/생활요금|정기결제|공과금/.test(n)) return '💡';
        if (/멤버십|디지털/.test(n)) return '🎫';
        if (/교보|도서|책/.test(n)) return '📚';
        if (/수수료/.test(n)) return '🆓';
        return '🏷️';
    }

    /* 혜택 메타 조회 (카드+혜택명) */
    function findBenefitMeta(cardName, benefitName) {
        if (!cardBenefitsData || !benefitName) return null;
        const searchCards = [cardName];
        const linked = getLinkedCompanyProduct(cardName);
        if (linked) searchCards.push(linked);
        for (const cn of searchCards) {
            if (!cardBenefitsData[cn]) continue;
            for (const benefits of Object.values(cardBenefitsData[cn])) {
                const found = benefits.find(b => b.name === benefitName);
                if (found) return found;
            }
        }
        return null;
    }

    /* --- 카드 순서 --- */
    /* 카드 자체 혜택(원 단위) 한도/사용 합계 — 통합 한도는 그룹당 1회 */
    function computeCardWonTotals(cardName, benefits, targetMonth) {
        const cardOnly = (benefits || []).filter(b => !b._fromCompany && b.provider !== '카드사');
        let totalLimit = 0;
        let totalUsed = 0;
        let hasAny = false;
        const seen = new Set();
        cardOnly.forEach(ben => {
            const unit = getUnitLabel(ben.rate, ben.limit);
            if (unit !== '원') return;
            if (isIntegratedLimit(ben)) {
                const gkey = getIntegratedGroupKey(ben);
                if (seen.has(gkey)) return;
                seen.add(gkey);
                const group = cardOnly.filter(b => isIntegratedLimit(b) && getIntegratedGroupKey(b) === gkey);
                const limitNum = parseLimitAmount(group[0].limit);
                if (!limitNum) return;
                hasAny = true;
                totalLimit += limitNum;
                const names = group.map(b => b.name);
                const usagePrefix = getUsagePeriodPrefix(targetMonth, group[0].period);
                const used = (benefitData || [])
                    .filter(item => item.cardName === cardName &&
                                    names.includes(item.benefitName) &&
                                    item.date.startsWith(usagePrefix))
                    .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
                totalUsed += used;
            } else {
                const limitNum = parseLimitAmount(ben.limit);
                if (!limitNum) return;
                hasAny = true;
                totalLimit += limitNum;
                const usagePrefix = getUsagePeriodPrefix(targetMonth, ben.period);
                const used = (benefitData || [])
                    .filter(item => item.cardName === cardName &&
                                    item.benefitName === ben.name &&
                                    item.date.startsWith(usagePrefix))
                    .reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
                totalUsed += used;
            }
        });
        const remain = Math.max(0, totalLimit - totalUsed);
        return { totalLimit, totalUsed, remain, hasAny };
    }

    function getCardOrder() {
        if (!cardBenefitsData) return [];
        const saved = JSON.parse(localStorage.getItem("card_order_cherry"));
        const allCards = Object.keys(cardBenefitsData);
        if (!saved || !Array.isArray(saved)) return allCards;
        // 저장된 순서 유지 + 새로 추가된 카드 뒤에 붙이기
        const ordered = saved.filter(c => allCards.includes(c));
        allCards.forEach(c => { if (!ordered.includes(c)) ordered.push(c); });
        return ordered;
    }

    function saveCardOrder() {
        const items = document.querySelectorAll("#card-list .card-item");
        const order = Array.from(items).map(item => item.getAttribute("data-card"));
        localStorage.setItem("card_order_cherry", JSON.stringify(order));
    }

    function moveCard(button, direction) {
        const item = button.closest(".card-item");
        const cardList = document.getElementById("card-list");
        if (direction === "up" && item.previousElementSibling) {
            cardList.insertBefore(item, item.previousElementSibling);
        } else if (direction === "down" && item.nextElementSibling) {
            cardList.insertBefore(item.nextElementSibling, item);
        }
        saveCardOrder();
    }

    /* --- 전월 실적 티어 변경 --- */
    function changePerformanceTier(cardName, tier) {
        const selectedMonth = document.getElementById('month-spinner').value;
        if (selectedMonth === 'ALL') return;

        if (!performanceData[selectedMonth]) {
            performanceData[selectedMonth] = {};
        }
        performanceData[selectedMonth][cardName] = tier;
        saveData();
        populateMonthSpinners(selectedMonth);
        renderMonthStatus(selectedMonth);
    }

    /* --- 월별 현황 렌더링 --- */
    function renderMonthStatus(targetMonth) {
        const cardListEl = document.getElementById('card-list');
        cardListEl.innerHTML = '';

        if (!cardBenefitsData || Object.keys(cardBenefitsData).length === 0) {
            cardListEl.innerHTML = `
                <div class="empty-state">
                    아직 카드 혜택 정보가 없습니다.<br>
                    우측 상단 <strong>⋮</strong> 메뉴에서<br>
                    <strong>「카드 혜택 가져오기」</strong>로 CSV 파일을 불러와 주세요.
                </div>`;
            return;
        }

        const monthPerf = performanceData[targetMonth] || {};
        const cardOrder = getCardOrder();

        cardOrder.forEach(cardName => {
            const tiers = cardBenefitsData[cardName];
            if (!tiers) return;

            // 카드사 혜택은 연결된 카드 아래에서만 표시 (단독 카드 형태 숨김)
            const providerType = getCardProviderType(cardName);
            if (providerType === '카드사') return;

            const tierKeys = getTierKeys(tiers);

            // 현재 선택된 티어 (월별 설정 > 기본 설정 > 가장 낮은 티어)
            const defaults = cardDefaults[cardName] || {};
            let selectedTier = monthPerf[cardName] || defaults.defaultTier || tierKeys[0];
            if (!tierKeys.includes(selectedTier)) selectedTier = tierKeys[0];

            // 월별 옵션 (없으면 설정 기본값)
            const selectedOptionBenefits = getMonthOptions(targetMonth, cardName);
            let benefits = filterBenefitsByOption(
                getBenefitsForTier(tiers, selectedTier),
                cardName,
                targetMonth
            );

            const isCompanyOrMembership = providerType === '카드사' || providerType === '멤버십사';

            // 연결된 카드사 혜택: 혜택별 실적산정기간(N) → 직전 N개월 평균 실적
            const linkedProduct = defaults.linkedCompanyProduct || '';
            if (!isCompanyOrMembership && linkedProduct && cardBenefitsData[linkedProduct]) {
                const companyTiers = cardBenefitsData[linkedProduct];
                const seenC = new Set();
                const grades = getMonthGrades(targetMonth, linkedProduct);
                Object.keys(companyTiers).forEach(tk => {
                    (companyTiers[tk] || []).forEach(b => {
                        const key = b.name + '|' + (b.limit || '');
                        if (seenC.has(key)) return;
                        seenC.add(key);
                        const need = parseTierAmount(tk);
                        const n = b.perfMonths > 0 ? b.perfMonths : 1;
                        const avg = getAveragePerformanceAmount(cardName, targetMonth, n);
                        if (need <= avg) {
                            const g = (b.grade || '').trim();
                            if (g && !grades.includes(g)) return;
                            benefits.push({ ...b, _fromCompany: linkedProduct, _avgPerf: avg, _perfMonths: n });
                        }
                    });
                });
            }

            // 멤버십 단독: 실적 수정 없음, 월별 등급 필터
            if (isCompanyOrMembership) {
                benefits = filterBenefitsByGrade(getBenefitsForTier(tiers, '0만원'), cardName, targetMonth);
                const more = [];
                Object.keys(tiers).forEach(tk => {
                    if (tk === '0만원') return;
                    more.push(...(tiers[tk] || []));
                });
                benefits = filterBenefitsByGrade(benefits.concat(more), cardName, targetMonth);
                // 이름 중복 제거
                const seenN = new Set();
                benefits = benefits.filter(b => {
                    if (seenN.has(b.name)) return false;
                    seenN.add(b.name);
                    return true;
                });
            }

            const cardDiv = document.createElement('div');
            cardDiv.className = 'card-item';
            cardDiv.setAttribute('data-card', cardName);

            let html = `
                <div class="card-header">
                    <div class="card-title-group">
                        <span class="card-name">${formatCardLabel(cardName)}</span>
                    </div>
                    <div class="order-btns">
                        <button class="order-btn" onclick="moveCard(this, 'up')">▲</button>
                        <button class="order-btn" onclick="moveCard(this, 'down')">▼</button>
                    </div>
                </div>
            `;

            // 한 줄 요약 + 설정 버튼
            const optionMapUi = {};
            Object.values(tiers).forEach(list => {
                (list || []).forEach(b => {
                    if (b.option && b.option.trim()) {
                        if (!optionMapUi[b.option]) optionMapUi[b.option] = new Set();
                        optionMapUi[b.option].add(b.name);
                    }
                });
            });
            const gradeSetUi = new Set();
            Object.values(tiers).forEach(list => {
                (list || []).forEach(b => {
                    if (b.grade && String(b.grade).trim()) gradeSetUi.add(String(b.grade).trim());
                });
            });
            const companyGradeSet = new Set();
            if (linkedProduct && cardBenefitsData[linkedProduct]) {
                Object.values(cardBenefitsData[linkedProduct]).forEach(list => {
                    (list || []).forEach(b => {
                        if (b.grade && String(b.grade).trim()) companyGradeSet.add(String(b.grade).trim());
                    });
                });
            }

            const summaryParts = [];
            if (providerType === '멤버십사') {
                // 실적 없음
            } else if (providerType === '카드사') {
                summaryParts.push('전월 실적 <strong>연결 카드 평균</strong>');
            } else {
                summaryParts.push('전월 실적 <strong>' + formatTierLabel(selectedTier) + '</strong>');
            }
            Object.keys(optionMapUi).sort().forEach(opt => {
                const cur = selectedOptionBenefits[opt] || '';
                summaryParts.push('옵션' + opt + ' <strong>' + (cur || '선택 안 함') + '</strong>');
            });
            if (gradeSetUi.size > 0) {
                const curGrades = getMonthGrades(targetMonth, cardName);
                summaryParts.push('등급 <strong>' + (curGrades.length ? curGrades.join(', ') : '없음') + '</strong>');
            }
            if (companyGradeSet.size > 0) {
                const curCompanyGrades = getMonthGrades(targetMonth, linkedProduct);
                summaryParts.push((linkedProduct || '카드사') + ' 등급 <strong>' + (curCompanyGrades.length ? curCompanyGrades.join(', ') : '없음') + '</strong>');
            }

            const needSettings = providerType !== '카드사' && (
                providerType !== '멤버십사' || Object.keys(optionMapUi).length > 0 || gradeSetUi.size > 0 || companyGradeSet.size > 0
            );
            // 멤버십도 등급 설정 필요, 일반 카드는 실적/옵션, 연결 등급
            const showSettingsBtn = providerType !== '카드사' && (
                providerType === '멤버십사'
                    ? (gradeSetUi.size > 0 || Object.keys(optionMapUi).length > 0)
                    : true
            );

            if (summaryParts.length > 0 || showSettingsBtn) {
                html += `<div class="month-settings-summary">
                    <div class="mss-text">${summaryParts.join(' · ') || '설정'}</div>
                    ${showSettingsBtn ? `<button type="button" class="mss-btn" title="이 달 설정" onclick="openMonthCardSettings('${escJs(cardName)}','${escJs(targetMonth)}')">⚙️</button>` : ''}
                </div>`;
            }

            // 카드 혜택 한도/사용/잔여 총합 (제공=카드만, 원 단위)
            if (providerType === '카드') {
                const totals = computeCardWonTotals(cardName, benefits, targetMonth);
                if (totals.hasAny) {
                    const pct = totals.totalLimit > 0
                        ? Math.min(100, Math.round((totals.totalUsed / totals.totalLimit) * 100))
                        : 0;
                    const exhausted = totals.remain <= 0;
                    html += `<div class="benefit-item${exhausted ? ' disabled' : ''}" style="margin-bottom:10px;border-style:dashed;">
                        <div class="benefit-item-header">
                            <span class="benefit-name">📊 카드 혜택 합계</span>
                            <span class="type type-청구할인">합계</span>
                        </div>
                        <div class="benefit-limit-row">
                            <span>사용: <strong>${totals.totalUsed.toLocaleString()}원</strong> / ${totals.totalLimit.toLocaleString()}원</span>
                            <span class="benefit-remaining${exhausted ? ' done' : ''}">${exhausted ? '사용 완료 ✅' : '잔여: ' + totals.remain.toLocaleString() + '원'}</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width:${pct}%"></div>
                        </div>
                    </div>`;
                }
            }

            html += `
                <div class="benefit-list">
            `;

            if (benefits.length === 0) {
                html += `<div style="font-size:0.85rem;color:var(--text-muted);">이 실적 구간에 해당하는 혜택이 없습니다.</div>`;
            } else {
                // 통합 한도 그룹핑
                const integratedGroups = {}; // limitStr -> [benefits]
                const normalBenefits = [];
                benefits.forEach(ben => {
                    if (isIntegratedLimit(ben)) {
                        const key = getIntegratedGroupKey(ben);
                        if (!integratedGroups[key]) integratedGroups[key] = [];
                        integratedGroups[key].push(ben);
                    } else {
                        normalBenefits.push(ben);
                    }
                });

                // 통합 한도 그룹 렌더
                Object.keys(integratedGroups).forEach(limitKey => {
                    const group = integratedGroups[limitKey];
                    // 한도 금액/횟수는 한도 열 값 사용 (통합 그룹 키가 아님)
                    const limitStr = group[0].limit || '';
                    const limitNum = parseLimitAmount(limitStr);
                    const unit = getUnitLabel(group[0].rate, limitStr);
                    const names = group.map(b => b.name);
                    const usagePrefix = getUsagePeriodPrefix(targetMonth, group[0].period);
                    const used = benefitData
                        .filter(item => item.cardName === cardName &&
                                        names.includes(item.benefitName) &&
                                        item.date.startsWith(usagePrefix))
                        .reduce((sum, item) => sum + item.amount, 0);
                    const isUnlimited = !limitNum;
                    const remain = isUnlimited ? null : Math.max(0, limitNum - used);
                    const percent = isUnlimited ? 0 : Math.min(100, Math.round((used / limitNum) * 100));
                    const isExhausted = !isUnlimited && remain === 0;
                    const disabledClass = isExhausted ? ' disabled' : '';

                    html += `<div class="benefit-item${disabledClass}">
                        <div class="benefit-item-header">
                            <span class="benefit-name">🔗 통합 한도 혜택</span>
                            <span class="type type-청구할인">통합</span>
                        </div>
                        <div class="benefit-meta">${group.map(b => getBenefitEmoji(b.name) + ' ' + b.name).join(' · ')}</div>`;
                    // 통합 요약은 클릭 없음 — 아래 개별 혜택 클릭

                    const isAnnualGroup = (group[0].period || '').trim() === '연간';
                    if (isUnlimited) {
                        html += `<div class="benefit-limit-row">
                            <span>사용: <strong>${isAnnualGroup ? '연 ' : ''}${used.toLocaleString()}${unit}</strong></span>
                            <span class="no-limit-text">한도 없음</span>
                        </div>`;
                    } else {
                        html += `<div class="benefit-limit-row">
                            <span>사용: <strong>${isAnnualGroup ? '연 ' : ''}${used.toLocaleString()}${unit}</strong> / ${limitNum.toLocaleString()}${unit}</span>
                            <span class="benefit-remaining${isExhausted ? ' done' : ''}">${isExhausted ? '사용 완료 ✅' : '잔여: ' + remain.toLocaleString() + unit + (isAnnualGroup ? ' / 년' : '')}</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width:${percent}%"></div>
                        </div>`;
                    }
                    html += `</div>`;

                    // 개별 혜택명만 간단히 표시 (한도 바 없이)
                    group.forEach(ben => {
                        const namePrefix = formatBenefitNamePrefix(ben);
                        const tagsHtml = buildBenefitTagsHtml(ben);
                        html += `<div class="benefit-item clickable" style="margin-left:8px;opacity:0.9;"
                            onclick="openBenefitDetail('${escJs(cardName)}','${escJs(ben.name)}','${escJs(targetMonth)}')">
                            <div class="benefit-item-header">
                                <span class="benefit-name">${getBenefitEmoji(ben.name)} ${namePrefix}${ben.name}</span>
                                ${tagsHtml}
                            </div>
                            <div class="benefit-meta">${ben.rate || ''} (통합 한도 적용)</div>
                        </div>`;
                    });
                });

                // 일반 혜택 렌더
                normalBenefits.forEach(ben => {
                    const usagePrefix = getUsagePeriodPrefix(targetMonth, ben.period);
                    const used = benefitData
                        .filter(item => item.cardName === cardName &&
                                        item.benefitName === ben.name &&
                                        item.date.startsWith(usagePrefix))
                        .reduce((sum, item) => sum + item.amount, 0);

                    const limitNum = parseLimitAmount(ben.limit);
                    const unit = getUnitLabel(ben.rate, ben.limit);
                    const isUnlimited = !limitNum;
                    const remain = isUnlimited ? null : Math.max(0, limitNum - used);
                    const percent = isUnlimited ? 0 : Math.min(100, Math.round((used / limitNum) * 100));
                    const isExhausted = !isUnlimited && remain === 0;
                    const emoji = getBenefitEmoji(ben.name);
                    const disabledClass = isExhausted ? ' disabled' : '';
                    const namePrefix = formatBenefitNamePrefix(ben);
                    const tagsHtml = buildBenefitTagsHtml(ben);

                    html += `
                        <div class="benefit-item clickable${disabledClass}"
                            onclick="openBenefitDetail('${escJs(cardName)}','${escJs(ben.name)}','${escJs(targetMonth)}')">
                            <div class="benefit-item-header">
                                <span class="benefit-name">${emoji} ${namePrefix}${ben.name}</span>
                                ${tagsHtml}
                            </div>
                            <div class="benefit-meta">${ben.rate || ''}</div>
                    `;

                    const isAnnualBen = (ben.period || '').trim() === '연간';
                    if (isUnlimited) {
                        html += `
                            <div class="benefit-limit-row">
                                <span>사용: <strong>${isAnnualBen ? '연 ' : ''}${used.toLocaleString()}${unit}</strong></span>
                                <span class="no-limit-text">${ben.limit || '한도 없음'}</span>
                            </div>
                        `;
                    } else if (isAnnualBen) {
                        html += `
                            <div class="benefit-limit-row">
                                <span>사용: <strong>연 ${used.toLocaleString()}${unit}</strong> / ${limitNum.toLocaleString()}${unit}</span>
                                <span class="benefit-remaining${isExhausted ? ' done' : ''}">${isExhausted ? '사용 완료 ✅' : '잔여: ' + remain.toLocaleString() + unit + ' / 년'}</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width:${percent}%"></div>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="benefit-limit-row">
                                <span>사용: <strong>${used.toLocaleString()}${unit}</strong> / ${limitNum.toLocaleString()}${unit}</span>
                                <span class="benefit-remaining${isExhausted ? ' done' : ''}">${isExhausted ? '사용 완료 ✅' : '잔여: ' + remain.toLocaleString() + unit}</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width:${percent}%"></div>
                            </div>
                        `;
                    }

                    html += `</div>`;
                });
            }

            html += `</div>`;
            cardDiv.innerHTML = html;
            cardListEl.appendChild(cardDiv);
        });
    }

    /* --- 차트 --- */
    function renderChart() {
        if (!cardBenefitsData) {
            if (myChart) { myChart.destroy(); myChart = null; }
            return;
        }

        const months = ['2026-06', '2026-07', '2026-08'];
        const cardNames = getCardOrder();
        const colors = ['#2563eb', '#3b82f6', '#60a5fa', '#6366f1', '#8b5cf6', '#0ea5e9', '#10b981'];

        const datasets = cardNames.map((name, idx) => {
            const data = months.map(m =>
                benefitData
                    .filter(i => i.cardName === name && i.date.startsWith(m))
                    .reduce((s, i) => s + i.amount, 0)
            );
            return {
                label: name.length > 12 ? name.slice(0, 12) + '…' : name,
                data: data,
                backgroundColor: colors[idx % colors.length]
            };
        });

        const ctx = document.getElementById('benefitChart').getContext('2d');
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['6월', '7월', '8월'],
                datasets: datasets
            },
            options: {
                responsive: true,
                scales: {
                    x: { stacked: false },
                    y: { beginAtZero: true }
                },
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } }
                }
            }
        });
    }

    /* --- 기록 폼 --- */
    function populateFormCards() {
        const select = document.getElementById('form-card');
        select.innerHTML = '<option value="">카드를 선택하세요</option>';
        if (!cardBenefitsData) return;

        getCardOrder().forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = cardIssuers[name] ? `[${cardIssuers[name]}] ${name}` : name;
            select.appendChild(opt);
        });
        updateBenefitOptions();
    }

    function updateBenefitOptions() {
        const cardName = document.getElementById('form-card').value;
        const benefitSelect = document.getElementById('form-benefit');
        benefitSelect.innerHTML = '';

        if (!cardName || !cardBenefitsData || !cardBenefitsData[cardName]) {
            benefitSelect.innerHTML = '<option value="">카드를 먼저 선택하세요</option>';
            return;
        }

        const dateVal = document.getElementById('form-date')?.value || '';
        const monthKey = dateVal ? dateVal.slice(0, 7) : getCurrentYearMonth();

        // 현황과 동일: 해당 월 실적 + 옵션 + 등급
        const tiers = cardBenefitsData[cardName];
        const tierKeys = getTierKeys(tiers);
        const defaults = cardDefaults[cardName] || {};
        const monthPerf = performanceData[monthKey] || {};
        let selectedTier = monthPerf[cardName] || defaults.defaultTier || tierKeys[0];
        if (!tierKeys.includes(selectedTier)) selectedTier = tierKeys[0];

        let list = filterBenefitsByOption(
            getBenefitsForTier(tiers, selectedTier),
            cardName,
            monthKey
        );
        list = filterBenefitsByGrade(list, cardName, monthKey).map(b => ({ ...b, _labelPrefix: '', _isCompany: false }));

        const benefitMap = new Map();
        list.forEach(b => {
            if (!benefitMap.has(b.name)) benefitMap.set(b.name, b);
        });

        const linked = getLinkedCompanyProduct(cardName);
        if (linked && cardBenefitsData[linked]) {
            const companyTiers = cardBenefitsData[linked];
            const grades = getMonthGrades(monthKey, linked);
            const seenC = new Set();
            Object.keys(companyTiers).forEach(tk => {
                (companyTiers[tk] || []).forEach(b => {
                    const key = b.name + '|' + (b.limit || '');
                    if (seenC.has(key)) return;
                    seenC.add(key);
                    const need = parseTierAmount(tk);
                    const n = b.perfMonths > 0 ? b.perfMonths : 1;
                    const avg = getAveragePerformanceAmount(cardName, monthKey, n);
                    if (need > avg) return;
                    const g = (b.grade || '').trim();
                    if (g && !grades.includes(g)) return;
                    if (!benefitMap.has(b.name)) {
                        benefitMap.set(b.name, {
                            ...b,
                            _labelPrefix: '[' + linked + '] ',
                            _isCompany: true
                        });
                    }
                });
            });
        }

        benefitSelect.innerHTML = '<option value="">혜택을 선택하세요</option>';
        benefitMap.forEach((b, name) => {
            const opt = document.createElement('option');
            opt.value = name;
            const emoji = getBenefitEmoji(name);
            const prefix = formatBenefitNamePrefix({
                _fromCompany: b._isCompany ? (b._labelPrefix || '').replace(/[\[\]\s]/g, '') : '',
                option: b.option,
                grade: b.grade
            });
            // _labelPrefix is like "[SFC] " for company
            const companyPart = b._labelPrefix || '';
            let mid = companyPart;
            if (b.option && String(b.option).trim()) mid += '[옵션' + String(b.option).trim() + '] ';
            if (b.grade && String(b.grade).trim()) mid += '[' + String(b.grade).trim() + '] ';
            const typeLabel = b._isCompany ? '카드사혜택' : (b.type || '');
            opt.textContent = `${emoji} ${mid}${name}${typeLabel ? ' (' + typeLabel + ')' : ''}`;
            opt.dataset.type = b._isCompany ? '카드사혜택' : (b.type || '');
            opt.dataset.rate = b.rate || '';
            opt.dataset.limit = b.limit || '';
            benefitSelect.appendChild(opt);
        });

        document.getElementById('form-payment').value = '';
        document.getElementById('form-amount').value = '';
        document.getElementById('form-calc-hint').textContent = '';
        const payGroup = document.getElementById('form-payment-group');
        if (payGroup) payGroup.style.display = '';
    }

    function onBenefitOrPaymentChange() {
        const cardName = document.getElementById('form-card').value;
        const benefitName = document.getElementById('form-benefit').value;
        const payment = Number(document.getElementById('form-payment').value) || 0;
        const amountInput = document.getElementById('form-amount');
        const amountLabel = document.getElementById('form-amount-label');
        const hint = document.getElementById('form-calc-hint');
        const payGroup = document.getElementById('form-payment-group');

        if (!cardName || !benefitName) {
            amountLabel.textContent = '혜택 금액 / 마일리지';
            hint.textContent = '';
            if (payGroup) payGroup.style.display = '';
            return;
        }

        const meta = findBenefitMeta(cardName, benefitName);
        if (!meta) return;

        const unit = getUnitLabel(meta.rate, meta.limit);
        amountLabel.textContent = unit === '마일' ? '적립 마일리지' : '혜택 금액 (원)';

        const provider = meta.provider || getCardProviderType(cardName);
        const calculable = isRateCalculable(meta.rate);

        // 카드사/멤버십사 + 계산 어려운 할인율 → 결제금액 없이 할인 금액만
        if ((provider === '카드사' || provider === '멤버십사') && !calculable) {
            if (payGroup) payGroup.style.display = 'none';
            document.getElementById('form-payment').value = '';
            amountInput.placeholder = '할인 금액을 입력하세요';
            hint.textContent = `할인 조건: ${meta.rate || '-'} / 한도: ${meta.limit || '없음'} · 직접 입력`;
            return;
        }

        if (payGroup) payGroup.style.display = '';
        amountInput.placeholder = '자동 계산됩니다';

        if (payment <= 0) {
            amountInput.value = '';
            hint.textContent = `계산식: ${meta.rate || '-'} / 한도: ${meta.limit || '없음'}`;
            return;
        }

        const calculated = calculateBenefitAmount(payment, meta.rate, meta.limit);
        const dateVal = document.getElementById('form-date')?.value || '';
        const excludeId = (typeof editingId !== 'undefined' && editingId != null) ? editingId : null;
        const remain = getRemainingLimit(cardName, benefitName, dateVal, excludeId);
        const limitNum = getBenefitLimitNum(cardName, benefitName, dateVal);
        const used = getUsedAmountForBenefit(cardName, benefitName, dateVal, excludeId);
        // 남은 한도까지만 적용 (잔여가 있으면 그 값, 잔여 0이면 0)
        let applied = calculated;
        if (remain != null) applied = Math.min(calculated, remain);
        amountInput.value = applied;
        if (remain != null && calculated > remain) {
            hint.textContent = `계산 ${calculated.toLocaleString()}${unit} → 한도 내 ${applied.toLocaleString()}${unit}만 적용 (한도 ${limitNum.toLocaleString()}${unit} · 기사용 ${used.toLocaleString()}${unit} · 잔여 ${remain.toLocaleString()}${unit})`;
        } else {
            hint.textContent = `자동 계산: ${meta.rate || '-'} → ${applied.toLocaleString()}${unit}` +
                (limitNum != null ? ` (한도 ${limitNum.toLocaleString()}${unit} · 잔여 ${(remain != null ? remain : limitNum).toLocaleString()}${unit})` : '') +
                ' · 수동 수정 가능';
        }
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        if (!cardBenefitsData) {
            alert('먼저 카드 혜택 CSV를 가져와 주세요.');
            return;
        }

        const cardName = document.getElementById('form-card').value;
        const benefitName = document.getElementById('form-benefit').value;
        const date = document.getElementById('form-date').value;
        const amount = Number(document.getElementById('form-amount').value);
        const payment = Number(document.getElementById('form-payment').value) || 0;
        const benefitSelect = document.getElementById('form-benefit');
        const type = benefitSelect.options[benefitSelect.selectedIndex]?.dataset?.type || '';

        if (!cardName || !benefitName || !date || amount < 0 || isNaN(amount)) {
            alert('모든 항목을 올바르게 입력해 주세요.');
            return;
        }

        const meta = findBenefitMetaForMonth(cardName, benefitName, date) || findBenefitMeta(cardName, benefitName);
        const unit = meta ? getUnitLabel(meta.rate, meta.limit) : '원';
        const excludeId = editingId != null ? editingId : null;
        const remain = getRemainingLimit(cardName, benefitName, date, excludeId);
        const limitNum = getBenefitLimitNum(cardName, benefitName, date);
        const used = getUsedAmountForBenefit(cardName, benefitName, date, excludeId);
        let finalAmount = Math.max(0, amount);
        if (remain != null) {
            if (remain <= 0 && amount > 0) {
                alert(`남은 한도가 없습니다.\n(한도 ${limitNum.toLocaleString()}${unit}, 기사용 ${used.toLocaleString()}${unit})`);
                return;
            }
            if (finalAmount > remain) {
                alert(`한도를 초과해 남은 ${remain.toLocaleString()}${unit}만 적용합니다.\n(한도 ${limitNum.toLocaleString()}${unit}, 기사용 ${used.toLocaleString()}${unit})`);
                finalAmount = remain;
            }
        }

        if (editingId != null) {
            const idx = benefitData.findIndex(r => r.id === editingId);
            if (idx !== -1) {
                benefitData[idx] = {
                    ...benefitData[idx],
                    cardName,
                    benefitName,
                    type,
                    date,
                    amount: finalAmount,
                    payment,
                    unit
                };
            }
        } else {
            benefitData.push({
                id: Date.now(),
                cardName,
                benefitName,
                type,
                date,
                amount: finalAmount,
                payment,
                unit
            });
        }
        saveData();
        renderAll();
        if (detailFilter) renderDetailHistoryList();
        document.getElementById('form-amount').value = '';
        document.getElementById('form-payment').value = '';
        document.getElementById('form-calc-hint').textContent = '';
        closeAddRecordModal();
    }

    function deleteRecord(id) {
        if (!confirm('정말 이 기록을 삭제하시겠습니까?')) return;
        benefitData = benefitData.filter(item => item.id !== id);
        saveData();
        renderAll();
        if (detailFilter) renderDetailHistoryList();
    }

    function renderHistoryList() {
        const historyList = document.getElementById('history-list');
        if (!historyList) return;
        historyList.innerHTML = '';

        const monthSel = document.getElementById('record-month-spinner');
        const selectedMonth = monthSel ? monthSel.value : 'ALL';

        let items = benefitData.slice();
        if (selectedMonth && selectedMonth !== 'ALL') {
            items = items.filter(item => item.date.startsWith(selectedMonth));
        }
        items.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (items.length === 0) {
            historyList.innerHTML = '<div style="font-size:0.85rem; color:var(--text-muted); text-align:center; padding:10px;">등록된 내역이 없습니다.</div>';
            return;
        }

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'record-history-item';
            const typeClass = 'type-' + (item.type || 'discount').replace(/\s/g, '');
            div.innerHTML = `
                <div class="record-history-left">
                    <span class="type ${typeClass}">${item.type || '혜택'}</span>
                    <div style="min-width:0;">
                        <strong style="display:block; font-size:0.85rem;">${formatCardLabel(item.cardName)}</strong>
                        <span class="history-benefit-name" title="${item.benefitName}">${getBenefitEmoji(item.benefitName)} ${item.benefitName}</span>
                        <span style="font-size:0.75rem; color:var(--text-muted); display:block;">${item.date}</span>
                    </div>
                </div>
                <div class="record-history-right">
                    <span class="record-amount">${item.amount.toLocaleString()}${item.unit || '원'}</span>
                    <div class="record-actions">
                        <button type="button" class="delete-btn" onclick="deleteRecord(${item.id})">삭제</button>
                        <button type="button" class="edit-btn" onclick="editRecord(${item.id})">수정</button>
                    </div>
                </div>
            `;
            historyList.appendChild(div);
        });
    }
</script>
